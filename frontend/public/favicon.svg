<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="discShine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0d0d10" />
    </radialGradient>
  </defs>
  <!-- Archival Dark Container Squircle -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="#222228" stroke-width="1.5" />
  
  <!-- Physical Vinyl / Film Disc Body -->
  <circle cx="32" cy="32" r="24" fill="url(#discShine)" stroke="#f4f3ef" stroke-width="2.5" />
  
  <!-- Concentric Sound / Optical Grooves -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#f4f3ef" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.45" />
  <circle cx="32" cy="32" r="13" fill="none" stroke="#f4f3ef" stroke-width="0.75" opacity="0.25" />
  
  <!-- Three 35mm Projector Aperture Vents -->
  <circle cx="32" cy="18.2" r="2.8" fill="#e5c66e" />
  <circle cx="20" cy="38.9" r="2.8" fill="#e5c66e" />
  <circle cx="44" cy="38.9" r="2.8" fill="#e5c66e" />
  
  <!-- Precision Center Spindle & Core -->
  <circle cx="32" cy="32" r="6.2" fill="#f4f3ef" />
  <circle cx="32" cy="32" r="2.6" fill="#09090b" />
  <circle cx="32" cy="32" r="1.1" fill="#e5c66e" />
</svg>
